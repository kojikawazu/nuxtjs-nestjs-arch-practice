name: CI

on:
  pull_request:
  push:
    branches: [main]

# dorny/paths-filter が PR の変更ファイル一覧を取得するのに pull-requests:read が要る。
# checkout には contents:read。最小権限のみ付与する。
permissions:
  contents: read
  pull-requests: read

# 同一参照の古い実行はキャンセルして無駄なランを省く
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # コード関連の変更があるかを判定する軽量ジョブ。
  # doc のみの変更では後続ジョブを skip するが、skip は required check 上は緑扱いになる
  # （ワークフロー単位の paths-ignore と違いマージがブロックされない）。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'docker-compose.yml'

  quality:
    name: Lint / Format / Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck

  backend:
    name: Backend (unit + e2e)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 同一 API 契約を実装する各アーキ版を横並びで検証する（layered / clean / …）
      matrix:
        pkg: [backend-layered, backend-clean, backend-onion]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/${{ matrix.pkg }} test
      # e2e は外部依存なしで動くよう in-memory SQLite を使う
      - run: pnpm --filter @app/${{ matrix.pkg }} test:e2e

  backend-mysql:
    name: Backend IT/E2E (MySQL コンテナ)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # 使い捨ての mysql-test コンテナ 1 つを DB 名で二役に使う（IT=taskdb_it / E2E=taskdb_e2e）。
      # Makefile 経由でコンテナ起動(--wait で healthy 待ち)込みに 3 版を回す＝ローカルと同一手順。
      - name: DB 忠実性 IT（taskdb_it・3 版）
        run: make test-back-it
      - name: e2e を MySQL コンテナで（taskdb_e2e・3 版）
        run: make test-back-e2e-mysql

  frontend:
    name: Frontend (unit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # SPA / SSR 版を横並びで検証する
      matrix:
        pkg: [frontend-spa, frontend-ssr]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/${{ matrix.pkg }} test

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 同じ通しシナリオを SPA / SSR 版それぞれの本番ビルドに対して実行する
      matrix:
        pkg: [frontend-spa, frontend-ssr]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # chromium とその OS 依存をインストール
      - run: pnpm --filter @app/${{ matrix.pkg }} exec playwright install --with-deps chromium
      # nuxt build → backend(SQLite)/frontend(本番出力) を自動起動して Playwright 実行
      - run: pnpm --filter @app/${{ matrix.pkg }} test:e2e
