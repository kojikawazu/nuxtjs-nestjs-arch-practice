name: CI

on:
  pull_request:
  push:
    branches: [main]

# dorny/paths-filter が PR の変更ファイル一覧を取得するのに pull-requests:read が要る。
# checkout には contents:read。最小権限のみ付与する。
permissions:
  contents: read
  pull-requests: read

# 同一参照の古い実行はキャンセルして無駄なランを省く
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # コード関連の変更があるかを判定する軽量ジョブ。
  # doc のみの変更では後続ジョブを skip するが、skip は required check 上は緑扱いになる
  # （ワークフロー単位の paths-ignore と違いマージがブロックされない）。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'docker-compose.yml'

  quality:
    name: Lint / Format / Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck

  backend:
    name: Backend (unit + e2e)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/backend-layered test
      # e2e は外部依存なしで動くよう in-memory SQLite を使う
      - run: pnpm --filter @app/backend-layered test:e2e

  frontend:
    name: Frontend (unit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/frontend-spa test

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # chromium とその OS 依存をインストール
      - run: pnpm --filter @app/frontend-spa exec playwright install --with-deps chromium
      # nuxt build → backend(SQLite)/frontend(本番出力) を自動起動して Playwright 実行
      - run: pnpm --filter @app/frontend-spa test:e2e
