# Markdown の静的解析設定。運用は .claude/rules/static-analysis.md に従う。
#
# 方針: **「見た目」のルールは有効にしない**。本リポジトリは .prettierignore で `*.md` を
# 除外しており（表の桁揃えで差分が肥大し、内容の差分がレビューで埋もれるため）、
# Markdown には整形役が居ない。見た目ルールを入れると手で直し続けることになり、
# 警告が常態化して検出装置として機能しなくなる。
# ここで拾うのは「描画結果が壊れる」「意味が変わる」「リンクが切れる」種類のものだけ。

config:
  # 行長。本文が日本語主体で 80 桁の制約に意味がない。
  # 折り返し位置を機械が決めると、表・URL・コードスパンが不自然に割れる（導入時 476 件）
  MD013: false

  # 表のパイプ前後の空白。純粋な見た目で、描画結果は変わらない。
  # 導入時 275 件。整形役が居ない以上、有効にしても直し続けられない
  MD060: false

  # 引用ブロックの間の空行。本リポジトリは「独立した注意書きを続けて置く」書き方を
  # 意図的に使っており（docs/07 の DryRun 廃止メモ等）、GitHub はこれを別々の引用として描画する。
  # 回避するには <!-- --> を挟む必要があり、本文にノイズが増えるだけ
  MD028: false

  # インライン HTML。README の折りたたみ（<details>）は GitHub 固有の記法で
  # Markdown に代替が無い。<summary> 内では `**` が強調として描画されないため <b> も要る。
  # ルール自体は残し、この 3 要素だけを許可する（無条件に開けると <script> 等も通る）
  MD033:
    allowed_elements:
      - details
      - summary
      - b

ignores:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/.nuxt/**'
  - '**/.output/**'
  - '**/coverage/**'
  - '**/tsp-output/**'
  - '**/playwright-report/**'
  - '**/test-results/**'
