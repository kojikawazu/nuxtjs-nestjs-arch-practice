# タスク管理アプリ用 compose（mysql + backend + frontend）。
# mysql-test は backend の e2e 用使い捨て DB。`test` profile に隔離してあり、
# 無印 `docker compose up` では起動しない。使うときは `docker compose --profile test up mysql-test`。
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskdb}
      MYSQL_USER: ${MYSQL_USER:-taskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskpassword}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-rootpassword}']
      interval: 5s
      timeout: 5s
      retries: 10

  # backend e2e テスト専用の使い捨て DB（本番 DB を汚さない）
  # test profile 限定: 無印の `docker compose up` では起動しない。
  mysql-test:
    image: mysql:8.4
    profiles: ['test']
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${TEST_DB_DATABASE:-taskdb_test}
      MYSQL_USER: ${MYSQL_USER:-taskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskpassword}
    ports:
      - '${TEST_DB_PORT:-3307}:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-rootpassword}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend-layered/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-taskuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-taskpassword}
      DB_DATABASE: ${MYSQL_DATABASE:-taskdb}
      # 学習用途: 起動時にスキーマ同期。本番ではマイグレーション運用にする。
      DB_SYNCHRONIZE: 'true'
      BACKEND_PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900s}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # 添付画像の保存先。下の volume をこのパスにマウントして永続化する。
      UPLOAD_DIR: /repo/apps/backend-layered/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    volumes:
      # コンテナ再作成で画像が消えないよう named volume で永続化する
      - uploads-data:/repo/apps/backend-layered/uploads

  # クリーンアーキ版バックエンド（比較用）。既定の `docker compose up` では起動せず、
  # `docker compose --profile clean up backend-clean` で必要時のみ起動する（同一 API 契約・別アーキ）。
  backend-clean:
    build:
      context: .
      dockerfile: apps/backend-clean/Dockerfile
    profiles: ['clean']
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-taskuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-taskpassword}
      DB_DATABASE: ${MYSQL_DATABASE:-taskdb}
      DB_SYNCHRONIZE: 'true'
      BACKEND_PORT: 3002
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900s}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      UPLOAD_DIR: /repo/apps/backend-clean/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
    ports:
      - '${BACKEND_CLEAN_PORT:-3002}:3002'
    volumes:
      - uploads-clean-data:/repo/apps/backend-clean/uploads

  # オニオンアーキ版バックエンド（比較用）。既定の `docker compose up` では起動せず、
  # `docker compose --profile onion up backend-onion` で必要時のみ起動する（同一 API 契約・別アーキ）。
  backend-onion:
    build:
      context: .
      dockerfile: apps/backend-onion/Dockerfile
    profiles: ['onion']
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-taskuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-taskpassword}
      DB_DATABASE: ${MYSQL_DATABASE:-taskdb}
      DB_SYNCHRONIZE: 'true'
      BACKEND_PORT: 3003
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900s}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      UPLOAD_DIR: /repo/apps/backend-onion/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
    ports:
      - '${BACKEND_ONION_PORT:-3003}:3003'
    volumes:
      - uploads-onion-data:/repo/apps/backend-onion/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend-spa/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      # サーバ側(BFF)は service 名で backend に到達。クライアント(ブラウザ)はホスト公開ポート。
      NUXT_API_BASE_URL: http://backend:3001
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-3001}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

  # SSR 版フロントエンド（比較用）。既定の `docker compose up` では起動せず、
  # `docker compose --profile ssr up frontend-ssr` で必要時のみ起動する（同一機能・SSR）。
  frontend-ssr:
    build:
      context: .
      dockerfile: apps/frontend-ssr/Dockerfile
    profiles: ['ssr']
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3010
      # SSR のサーバ側セッション復元・BFF は service 名で backend に到達。クライアントはホスト公開ポート。
      NUXT_API_BASE_URL: http://backend:3001
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-3001}
    ports:
      - '${FRONTEND_SSR_PORT:-3010}:3010'

volumes:
  mysql-data:
  uploads-data:
  uploads-clean-data:
  uploads-onion-data:
